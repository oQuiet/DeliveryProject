[project]
name = "deliveryproject"
version = "0.1.0"
description = ""
authors = [
    {name = "Ruslan",email = "javigame@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi (>=0.139.2,<0.140.0)", "uvicorn (>=0.51.0,<0.52.0)", "asyncpg (>=0.31.0,<0.32.0)", "sqlalchemy (>=2.0.51,<3.0.0)", "pydantic-settings (>=2.14.2,<3.0.0)", "alembic (>=1.18.5,<2.0.0)", "psycopg2-binary (>=2.9.12,<3.0.0)", "aiohttp (>=3.14.3,<4.0.0)", "redis (>=8.0.1,<9.0.0)", "motor (>=3.7.1,<4.0.0)", "beanie (>=2.1.0,<3.0.0)", "pymongo (>=4.17.0,<5.0.0)", "requests (>=2.34.2,<3.0.0)", "loguru (>=0.7.3,<0.8.0)", "celery (>=5.6.3,<6.0.0)"]

[dependency-groups]
dev = [
    "ruff (>=0.15.22,<0.16.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "typing-extensions (>=4.16.0,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "radon (>=6.0.1,<7.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "httpx2 (>=2.9.1,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "app", from = "src" }
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["src/tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]